<html lang="en">
<head>

    <title>Document</title>
    <style>
        body {
  font-family: Arial, sans-serif;
  background-color: #f5f5f5;
  padding: 20px;
}

.table-container {
  width: 90%;
  max-width: 800px;
  margin: 0 auto;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  background-color: white;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

thead th {
  background-color: #3F51B5;
  color: white;
  padding: 12px;
  text-align: left;
  font-weight: bold;
}

tbody td {
  padding: 12px;
  border-top: 1px solid #ddd;
  font-size: 16px;
}

tbody tr:hover {
  background-color: #f0f8ff;
}

    </style>
</head>

</html>
