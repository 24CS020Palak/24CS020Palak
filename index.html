<!DOCTYPE html>
<html lang="en">
<head>
  <title>Student Portal - Home</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #F4F6F8;
      color: #333;
      background-image: url("https://charusat.edu.in/icSoftComp2024/images/slider-main/charusatgate.png");
      background-size: cover;
      
    header {
      background-color: #3F51B5;
      color: white;
      padding: 20px;
      text-align: center;
    }
    nav {
      background: #303F9F;
      padding: 10px;
      text-align: center;
    }
    nav a {
      color: white;
      margin: 10px;
      text-decoration: none;
      font-weight: bold;
      padding: 8px 15px;
      border-radius: 4px;
      transition: background 0.3s;
    }
    nav a:hover {
      background-color: #1A237E;
    }
    .container {
      padding: 30px;
      text-align: center;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 600px;
      margin: 30px auto;
    }
    

    
    }

    footer{
      position: fixed;
      bottom: 0;
      width: 100%;
    background-color: #303F9F;
    color: white;
    text-align: center;
     padding: 20px;  
    font-size: 0.9rem;
}

footer a {
    color: white;
    
    text-decoration: none;
}
 @media (max-width: 768px) {
      header h1 {
        font-size: 1.5rem;
      }

      nav a {
        margin: 5px;
        padding: 6px 10px;
        font-size: 0.9rem;
      }

      .card {
        margin: 20px 15px;
        padding: 15px;
      }

      footer {
        padding: 15px;
        font-size: 0.8rem;
      }
    }

    @media (max-width: 480px) {
      header h1 {
        font-size: 1.2rem;
      }

      nav {
        padding: 8px;
      }

      nav a {
        display: block;
        margin: 8px 0;
      }

      .card h2 {
        font-size: 1.2rem;
      }

      .container {
        padding: 20px 10px;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>Welcome to the Student Portal</h1>
</header>

<nav>
  <a href="login.html">Login</a>
</nav>

<div class="container">
  <div class="card">
    <h2>Your Academic Journey Starts Here</h2>
    <p>This portal helps students access their academic information, attendance, grades, assignments, and more.</p>
  </div>
</div>
    <footer>
        &copy; 2025 Student Portal | <a href="#">Terms</a> | <a href="#">Privacy</a>
    </footer>
</body>
</html>
