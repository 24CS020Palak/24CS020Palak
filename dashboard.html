<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="stylesheet" href="style-homePage.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins' , sans-serif;
}

body {
    background-color: #f0f4ff;
    min-height: 100vh;
}

header{
    background-color:/*#1A237E*/#303F9F;
    color: white;
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
}


nav{
    display: flex;
    gap: 25px;
}

nav a{
    color: white;
    text-decoration: none;
    font-weight: 500;
    transition: color 0.3s;
}

nav a:hover {
    color: #ccc;
}

.cards{
    display: grid;
    grid-template-columns: repeat(2 , 1fr);
    grid-template-rows: repeat(2,1fr);
    gap: 30px;
    padding: 60px;
    min-height: calc(100vh-160px);
}

.card{
    background-color: #fff;
    padding: 40px 30px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    transition: transform 0.3s, box-shadow 0.3s ;
}


.card a {
    text-decoration: none;
    font-size: 1.2rem;
    color: #303F9F ;
    display: block;
}

.card i {
    font-size: 2.2rem;
    color: #303F9F;
    margin-bottom: 15px;
}

footer{
    background-color: #303F9F;
    color: white;
    text-align: center;
    padding: 20px;
    font-size: 0.9rem;
}

footer a {
    color: white;
    margin: 0 10px;
    text-decoration: none;
}

.dropdown {
  position: relative;
  display: inline-block;
}

.dropdown-content {
  display: none;
  position: absolute;
  background-color:#303F9F;
  min-width: 160px;
  top: 100%;
  right: 0;
  z-index: 1;
  border-radius: 4px;
}

.dropdown-content a {
  color: white;
  padding: 12px 16px;
  text-decoration: none;
  display: block;
}

.dropdown:hover .dropdown-content {
  display: block;
}

.dropdown-content a:hover {
  background-color: #303F9F;
}



@media(max-width: 600px){
    nav{
        flex-direction: column;
        gap: 10px;
        margin-top: 10px;
    }
    .cards{
        padding: 20px;
    }
}
    </style>
</head>

<body>
    <header>
        <div class="logo">
            <img src="https://www.charusat.ac.in/assets/images/logo/logo.webp" alt="logo of university" height="60px" width=auto>
        </div>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="#">Notifications <i class="fas fa-bell"></i></a>

            <div class="dropdown">
                <a href="#">Menu <i class="fas fa-caret-down"></i></a>
                <div class="dropdown-content">
                    <a href="Profile.html"><i class="fas fa-user"></i> Profile</a>
                    <a href="feedback.html"><i class="fas fa-caret-down"></i> Feedback</a>
                    <a href="course.html"><i class="fas fa-book-open"></i> Course</a>
                    <a href="index.html"><i class="fas fa-sign-out-alt"></i> Log-out</a>
                </div>
            </div>
        </nav>
    </header>
    
    <section class="cards">

        

        
        
        <div class="card">
            <a href="timetable.html"><i class="fas fa-calendar"></i>Time-Table</a>
        </div>

        <div class="card">
            <a href="attendance.html"><i class="fas fa-clipboard-list"></i>Attendance</a>
        </div>

        <div class="card">
            <a href="fees.html"><i class="fas fa-money-check-alt"></i>Fees</a>
        </div>

        <div class="card">
            <a href="grades.html"><i class="fas fa-chart-bar"></i>Result</a>
        </div>

        

    </section>
    <footer>
        &copy; 2025 Student Portal | <a href="#">Terms</a> | <a href="#">Privacy</a>
    </footer>
</body>

</html>
